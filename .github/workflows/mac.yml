# Build Nusa.app di Mac-nya GitHub, terus ganti Nusa-macOS.zip di Release v1.0.0.
# Jalan sendiri tiap kode Mac berubah di main, atau manual dari tab Actions.
name: Build Mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Sources/**', 'helper/**', 'assets/**', 'build.sh', '.github/workflows/mac.yml']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: sh build.sh --no-install
      # Potret tiap keadaan ke PNG: layar biasa & MacBook ber-notch (disimulasiin), buat dicek tanpa Mac
      - name: Render tampilan
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p shots/normal shots/notch
          dist/Nusa.app/Contents/MacOS/Nusa --render "$PWD/shots/normal"
          NUSA_NOTCH=200x32 dist/Nusa.app/Contents/MacOS/Nusa --render "$PWD/shots/notch"
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: shots
      - run: ditto -c -k --keepParent dist/Nusa.app Nusa-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Nusa-macOS
          path: Nusa-macOS.zip
      - name: Ganti Nusa-macOS.zip di Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 Nusa-macOS.zip --clobber
